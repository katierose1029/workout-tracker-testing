name: Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or tag of workout-tracker to test
        default: main
  schedule:
    - cron: '17 14 * * *'   # daily, to catch changes pushed to the app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run app:fetch
        env:
          APP_REF: ${{ inputs.app_ref || 'main' }}
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
